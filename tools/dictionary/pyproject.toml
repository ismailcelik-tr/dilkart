[project]
name = "dilkart-dict"
version = "0.1.0"
description = "Builds the DilKart offline dictionary pack"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dilkart_dict"]
